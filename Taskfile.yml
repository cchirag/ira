version: "3"

vars:
  MODE: '{{default "dev" .MODE}}'
  DAEMON_BIN: bin/irad/irad{{exeExt}}
  CLIENT_BIN: bin/ira/ira{{exeExt}}
  EMBED_DIR: cmd/ira/bin
  DAEMON_LOG_FILE: tmp/log/daemon.log
  CLIENT_LOG_FILE: tmp/log/client.log

tasks:
  build:daemon:
    desc: Build irad daemon (MODE=dev|prod, default dev)
    sources:
      - cmd/irad/**/*.go
      - internal/**/*.go
    generates:
      - "{{.DAEMON_BIN}}"
    cmds:
      - go build -tags {{.MODE}} -o {{.DAEMON_BIN}} cmd/irad/main.go

  run:daemon:
    desc: Run irad daemon (MODE=dev|prod, default dev)
    cmds:
      - go run -tags {{.MODE}} cmd/irad/main.go

  copy:daemon:
    desc: Copy daemon binary to client embed directory
    internal: true
    deps: [build:daemon]
    sources:
      - "{{.DAEMON_BIN}}"
    generates:
      - "{{.EMBED_DIR}}/irad{{exeExt}}"
    cmds:
      - mkdir -p {{.EMBED_DIR}}
      - cp {{.DAEMON_BIN}} {{.EMBED_DIR}}/

  build:client:
    desc: Build ira client (MODE=dev|prod, default dev)
    deps: [copy:daemon]
    sources:
      - cmd/ira/**/*.go
      - internal/**/*.go
      - "{{.EMBED_DIR}}/irad{{exeExt}}"
    generates:
      - "{{.CLIENT_BIN}}"
    cmds:
      - go build -tags {{.MODE}} -o {{.CLIENT_BIN}} ./cmd/ira

  run:client:
    desc: Run ira client (MODE=dev|prod, default dev)
    deps: [copy:daemon]
    cmds:
      - go run -tags {{.MODE}} ./cmd/ira

  log:daemon:
    desc: Tail daemon logs
    cmds:
      - |
        {{if eq OS "windows"}}
        powershell -Command "Get-Content {{.DAEMON_LOG_FILE}} -Wait -Tail 50"
        {{else}}
        tail -f {{.DAEMON_LOG_FILE}}
        {{end}}

  log:client:
    desc: Tail client logs
    cmds:
      - |
        {{if eq OS "windows"}}
        powershell -Command "Get-Content {{.CLIENT_LOG_FILE}} -Wait -Tail 50"
        {{else}}
        tail -f {{.CLIENT_LOG_FILE}}
        {{end}}

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin {{.EMBED_DIR}}
      - rm -rf tmp

  gen:
    desc: Generate grpc client and server code
    cmds:
      - buf generate

  setup:
    desc: Setup project (generate code, install dependencies, etc.)
    cmds:
      - go mod tidy
      - task: clean
      - task: gen
